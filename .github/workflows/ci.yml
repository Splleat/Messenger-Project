name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 같은 브랜치에 새 푸시가 오면 진행 중인 실행 취소

jobs:
  build-test:
    name: 빌드 및 테스트 # Testcontainers 동작을 위해 Docker가 내장된 리눅스 러너 사용
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-with-at-least-32-characters-long
      TSID_NODE: "0"
    steps:
      - name: 체크아웃 # Repository 코드를 러너로 클론
        uses: actions/checkout@v4

      - name: JDK 25 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven # ~/.m2 의존성 캐싱 -> 2회차부터 빌드 빨라짐

      - name: 빌드 및 테스트
        run: ./mvnw -B clean verify # clean -> compile -> test -> verify

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: 배포 (EC2)
    needs: build-test # 빌드·테스트 통과해야 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' # dev 직접 push에만 (PR 제외)
    runs-on: ubuntu-latest
    steps:
      - name: EC2 SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Messenger-Project
            git pull origin dev
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
