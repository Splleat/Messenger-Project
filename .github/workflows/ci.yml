name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # 같은 브랜치에 새 푸시가 오면 진행 중인 실행 취소

jobs:
  build-test:
    name: 빌드 및 테스트 # Testcontainers 동작을 위해 Docker가 내장된 리눅스 러너 사용
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-with-at-least-32-characters-long
      TSID_NODE: "0"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: 체크아웃 # Repository 코드를 러너로 클론
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud 블레임 분석을 위해 전체 히스토리 필요

      - name: JDK 25 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven # ~/.m2 의존성 캐싱 -> 2회차부터 빌드 빨라짐

      - name: 빌드 및 테스트
        run: ./mvnw -B clean verify # clean -> compile -> test -> verify

      - name: SonarCloud 분석
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B sonar:sonar

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  build-push:
    name: 이미지 빌드 및 GHCR Push
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시 (latest + 커밋SHA)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/splleat/messenger-project:latest
            ghcr.io/splleat/messenger-project:${{ github.sha }}

  deploy:
    name: 배포 (EC2)
    needs: build-push # 이미지 push까지 끝나야 배포
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: EC2 SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/Messenger-Project
            git pull origin main
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d
            docker image prune -f
