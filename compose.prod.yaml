services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  app:
    image: ghcr.io/splleat/messenger-project:latest
    container_name: messenger-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: docker
      TSID_NODE: ${TSID_NODE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DDL_AUTO: ${DDL_AUTO:-validate}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_db}
      STORAGE_ENDPOINT: ""
      STORAGE_REGION: ${S3_REGION:-ap-northeast-2}
      STORAGE_BUCKET: ${S3_BUCKET}
      CORS_ALLOWED_ORIGINS: ${FRONT_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: caddy-container
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090" # SSH 터널(ssh -L 9090:localhost:9090)로만 접근
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-container
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # SSH 터널(ssh -L 3000:localhost:3000)로만 접근
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
