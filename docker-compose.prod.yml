services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: messenger-app
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      SECRET_KEY: ${SECRET_KEY}
      TSID_NODE: ${TSID_NODE:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DDL_AUTO: ${DDL_AUTO:-validate}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_db}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      STORAGE_ENDPOINT: ""
      STORAGE_REGION: ${S3_REGION:-ap-northeast-2}
      STORAGE_BUCKET: ${S3_BUCKET}
      CORS_ALLOWED_ORIGINS: ${FRONT_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    container_name: caddy-container
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
