spring:
  datasource:
    url: jdbc:h2:mem:testdb;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2000ms

jwt:
  secret: ${SECRET_KEY}
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)