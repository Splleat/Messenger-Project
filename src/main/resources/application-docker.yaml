spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  flyway:
    # 기존 운영 DB를 버전 1로 간주하고, 그 이후 변경 사항만 새 마이그레이션 스크립트로 관리
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: redis
      port: 6379
      connect-timeout: 2000ms
      
storage:
  # endpoint 비우면 (프로덕션) AWS S3 모드, 채우면 MinIO/S3호환 모드
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:messenger}
  max-size-bytes: 10485760 # 10MB