spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      # 최초 배포 1회만 DDL_AUTO=update 로 스키마 생성 후 전환
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
  data:
    redis:
      host: redis
      port: 6379
      connect-timeout: 2000ms
      
storage:
  # endpoint 비우면 (프로덕션) AWS S3 모드, 채우면 MinIO/S3호환 모드
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:messenger}
  max-size-bytes: 10485760 # 10MB