spring:
  datasource:
    url: "jdbc:mysql://localhost:13306/my_db?allowPublicKeyRetrieval=true&useSSL=false"
    username: user
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    # show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2000ms

  flyway:
    enabled: false

jwt:
  secret: local-dev-only-secret-key-at-least-32-characters-long

storage:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: minioadmin
  secret-key: minioadmin
  bucket: messenger
  max-size-bytes: 10485760 # 10MB

logging:
  level:
    me.splleat.messengerproject: ${LOG_LEVEL:DEBUG}
