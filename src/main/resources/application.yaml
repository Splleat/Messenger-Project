jwt:
  public-paths: /auth/login, /auth/register, /auth/refresh, /ws-stomp, /actuator/health, /actuator/prometheus, /swagger-ui, /v3/api-docs
  secret: ${SECRET_KEY}
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

spring:
  threads:
    virtual:
      enabled: true
  cache:
    redis:
      time-to-live: 24h

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    me.splleat.messengerproject: ${LOG_LEVEL:INFO}

# actuator는 health/prometheus만 공개, 상세 숨김 (env/beans 등 노출 차단)
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never

relay:
  grace-seconds: 2
  give-up-seconds: 60

springdoc:
  swagger-ui:
    try-it-out-enabled: false