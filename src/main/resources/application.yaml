jwt:
  secretKey: ${SECRET_KEY}
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

security:
  public-paths:
    - /auth/login
    - /auth/register
    - /auth/refresh
    - /ws-stomp/**
    - /actuator/health
    - /actuator/prometheus
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs
    - /v3/api-docs/**

spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false"
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  threads:
    virtual:
      enabled: true
  cache:
    redis:
      time-to-live: 24h
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    jdbc:
      batch_size: 50
  data:
    redis:
      host: redis
      port: 6379
      connect-timeout: 2000ms
  flyway:
    # 기존 운영 DB를 버전 1로 간주하고, 그 이후 변경 사항만 새 마이그레이션 스크립트로 관리
    baseline-on-migrate: true
    baseline-version: 1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    me.splleat.messengerproject: INFO
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        message.send.duration: true

relay:
  grace-seconds: 2
  give-up-seconds: 60

redis:
  topic:
    message: messenger:message
    typing: messenger:typing
    notification: messenger:notification
  prefix:
    blacklist: "blacklist:"
    refresh: "refresh:"