spring:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  test:
    database:
      replace: none
  cache:
    type: none

jwt:
  secretKey: this-is-a-test-secret-key-with-at-least-32-characters-long
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)

security:
  public-paths:
    - /auth/login
    - /auth/register
    - /auth/refresh
    - /ws-stomp/**
    - /actuator/health
    - /actuator/prometheus
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs
    - /v3/api-docs/**

storage:
  endpoint: http://localhost:9000
  region: us-east-1
  access-key: minioadmin
  secret-key: minioadmin
  bucket: messenger
  max-size-bytes: 10485760 # 10MB

tsid:
  node: 0

cors:
  allowed-origins: http://localhost:3000

relay:
  grace-seconds: 2
  give-up-seconds: 60

redis:
  topic:
    message: messenger:message
    typing: messenger:typing
    notification: messenger:notification
  prefix:
    blacklist: "blacklist:"
    refresh: "refresh:"