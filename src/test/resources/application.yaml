spring:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  test:
    database:
      replace: none

jwt:
  public-paths: /auth/login, /auth/register, /auth/refresh, /h2-console, /ws-stomp
  secret: this-is-a-test-secret-key-with-at-least-32-characters-long
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 604800000 # 7일 (ms)